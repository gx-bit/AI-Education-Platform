networks:
  edu-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:

services:
  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    networks: [edu-net]
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-edu123456}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-edu123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    networks: [edu-net]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: edu-rabbitmq
    networks: [edu-net]
    environment:
      RABBITMQ_DEFAULT_USER: edu
      RABBITMQ_DEFAULT_PASS: edu123456
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: edu-nacos
    networks: [edu-net]
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "19848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: edu-zipkin
    networks: [edu-net]
    ports:
      - "19411:9411"
    environment:
      STORAGE_TYPE: mem

  # ==================== 微服务 ====================

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: edu-gateway
    networks: [edu-net]
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_HOST: nacos
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-edu-platform-jwt-secret-key-2024-very-long-secret}
      ZIPKIN_HOST: zipkin
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: edu-user
    networks: [edu-net]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_HOST: nacos
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edu123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-edu-platform-jwt-secret-key-2024-very-long-secret}
      ZIPKIN_HOST: zipkin
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: edu-course
    networks: [edu-net]
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_HOST: nacos
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edu123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-placeholder}
      ZIPKIN_HOST: zipkin
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: edu-order
    networks: [edu-net]
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_HOST: nacos
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edu123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: edu
      RABBITMQ_PASS: edu123456
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_MOCK_ENABLED: ${ALIPAY_MOCK_ENABLED:-true}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi.alipaydev.com/gateway.do}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_MERCHANT_PRIVATE_KEY: ${ALIPAY_MERCHANT_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost/payment/result}
      ALIPAY_MOCK_CASHIER_URL: ${ALIPAY_MOCK_CASHIER_URL:-http://localhost/payment/cashier}
      ZIPKIN_HOST: zipkin
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: edu-notification
    networks: [edu-net]
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_HOST: nacos
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edu123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: edu
      RABBITMQ_PASS: edu123456
      ZIPKIN_HOST: zipkin
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: edu-recommendation
    networks: [edu-net]
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_HOST: nacos
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edu123456}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edu-frontend
    networks: [edu-net]
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    restart: on-failure
