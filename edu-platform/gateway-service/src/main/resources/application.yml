server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # 用户服务
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # 课程服务
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/course/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # 订单服务
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # 通知服务
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notify/**

        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendation/**

        - id: agent-service
          # Python FastAPI 服务不注册 Nacos，由网关通过 Docker DNS 转发。
          uri: ${AGENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/agent/**

        # Swagger 文档聚合
        - id: user-service-doc
          uri: lb://user-service
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service(?<segment>.*), $\{segment}

        - id: course-service-doc
          uri: lb://course-service
          predicates:
            - Path=/course-service/v3/api-docs
          filters:
            - RewritePath=/course-service(?<segment>.*), $\{segment}

        - id: order-service-doc
          uri: lb://order-service
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service(?<segment>.*), $\{segment}

# JWT 配置（与各服务保持一致）
jwt:
  secret: ${JWT_SECRET:edu-platform-jwt-secret-key-2024-very-long-secret}
  expiration: 86400000

# 白名单（不需要JWT验证的路径）
gateway:
  white-list: /api/user/register,/api/user/login,/api/recommendation/courses,/api/recommendation/behavior,/api/order/payment/alipay/notify,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**

# Swagger 聚合
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 用户服务
        url: /user-service/v3/api-docs
      - name: 课程服务
        url: /course-service/v3/api-docs
      - name: 订单服务
        url: /order-service/v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  level:
    com.edu.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
