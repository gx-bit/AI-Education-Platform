server:
  port: 8086
spring:
  application:
    name: agent-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/edu_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql.init:
    mode: always
    encoding: UTF-8
agent:
  recommendation-base-url: ${RECOMMENDATION_BASE_URL:http://localhost:8085}
  ai-base-url: ${AI_BASE_URL:}
  ai-api-key: ${AI_API_KEY:}
  ai-model: ${AI_MODEL:deepseek-chat}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.show-details: always
